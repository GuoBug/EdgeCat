server:
  # Default is strictly loopback (127.0.0.1).
  # If changing to 0.0.0.0 or LAN IP, auth.enabled must be true with at least one client,
  # or server.allow_insecure_lan must be set to true (Fail-Closed LAN Guard / R2.1).
  host: "127.0.0.1"
  port: 8080
  read_timeout_ms: 30000
  write_timeout_ms: 120000
  # SSE only: streams are bounded by idle time rather than total duration, so a
  # slow local model can keep streaming past write_timeout_ms.
  stream_idle_timeout_ms: 300000
  # Allowed CORS origins. Leave empty to deny all cross-origin requests by default (secure fail-closed).
  # Set explicitly or use "*" to allow specific origins.
  allowed_origins:
    - "https://patchcat.dev"
    - "http://localhost:5173"
  # Inbound request body size limit in bytes (default: 10MB)
  max_request_body_bytes: 10485760
  # Bypass Fail-Closed guard when binding to 0.0.0.0 without auth (NOT recommended).
  allow_insecure_lan: false

auth:
  # Multi-device / homelab client authentication (R2.2)
  enabled: false
  clients:
    - name: "macbook-workstation"
      token: "ec-dev-token-abc"
      # Daily cloud fallback limits (R2.3):
      # 0: unlimited, -1: local only (no cloud fallback allowed), >0: max daily cloud calls
      daily_cloud_limit: 500
    - name: "family-tablet"
      token: "ec-pad-token-xyz"
      daily_cloud_limit: 50

local:
  endpoint: "http://127.0.0.1:11434/v1"
  api_key: ""
  max_concurrent_local: 2
  queue_wait_ms: 0              # Optional wait budget (ms) when local slots are full before cloud fallback
  ttft_timeout_ms: 3500
  stream_idle_timeout_ms: 30000 # Idle timeout between chunks during generation (default 30s)
  breaker_failure_threshold: 3  # Consecutive local failures before tripping circuit breaker
  breaker_cooldown_ms: 30000    # Cooldown before admitting a half-open probe request
  model_mapping:
    "default": "qwen2.5:7b"
    "gpt-4o-mini": "qwen2.5:7b"
    "qwen2.5:7b": "qwen2.5:7b"

cloud:
  endpoint: "https://api.openai.com/v1"
  api_key: "sk-your-cloud-api-key"
  timeout_ms: 60000
  model_mapping:
    "default": "gpt-4o-mini"
    "qwen2.5:7b": "gpt-4o-mini"

filter:
  enabled: true
  policy: "mask_always"         # mask_always | mask_on_egress | local_only | block
  mask_phone: true
  mask_email: true
  mask_ipv4: true
  mask_apikey: true
  mask_idcard: false
  mask_bankcard: false
  block_apikey_tool_rehydrate: true
  # hmac_secret: "${EDGECAT_PII_HMAC_SECRET}"  # Optional: enables cross-request HMAC-SHA256 stable PII keys

contract:
  strict_json_enabled: true
  max_repair_attempts: 1
  repair_timeout_ms: 5000

audit:
  sqlite_path: "data/edgecat_audit.db"
  batch_size: 50
  flush_interval_ms: 1000
  queue_size: 10000

# Optional: Opt-in Layered Memory RequestMutator plugin (R3.2 / R3.2.1, disabled by default)
memory:
  enabled: false
  sqlite_path: "data/edgecat_memory.db"
  max_pinned_facts: 10            # Zone 1 deterministic static prefix cap (id ASC at messages[0])
  max_facts: 5                    # Zone 2 dynamic FTS5 retrieval cap (inserted before last user message)
  max_short_term: 3               # Zone 2 recent rolling summaries cap
  query_timeout_ms: 50            # Fail-open retrieval timeout budget (ms)
  reader_max_open_conns: 4        # Read-only SQLite pool size for concurrent retrieval
  prepend_dynamic_context: false  # Set true ONLY if upstream chat template rejects mid-conversation system messages
