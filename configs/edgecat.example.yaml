server:
  # Default is strictly loopback (127.0.0.1).
  # If changing to 0.0.0.0 or LAN IP, auth.enabled must be true with at least one client,
  # or server.allow_insecure_lan must be set to true (Fail-Closed LAN Guard / R2.1).
  host: "127.0.0.1"
  port: 8080
  read_timeout_ms: 30000
  write_timeout_ms: 120000
  # SSE only: streams are bounded by idle time rather than total duration, so a
  # slow local model can keep streaming past write_timeout_ms.
  stream_idle_timeout_ms: 300000
  # Allowed CORS origins for PatchCat or Web UIs. Leave empty to allow all local origins.
  allowed_origins:
    - "https://patchcat.dev"
    - "http://localhost:5173"
  # Bypass Fail-Closed guard when binding to 0.0.0.0 without auth (NOT recommended).
  allow_insecure_lan: false

auth:
  # Multi-device / homelab client authentication (R2.2)
  enabled: false
  clients:
    - name: "macbook-workstation"
      token: "ec-dev-token-abc"
      # Daily cloud fallback limits (R2.3):
      # 0: unlimited, -1: local only (no cloud fallback allowed), >0: max daily cloud calls
      daily_cloud_limit: 500
    - name: "family-tablet"
      token: "ec-pad-token-xyz"
      daily_cloud_limit: 50

local:
  endpoint: "http://127.0.0.1:11434/v1"
  api_key: ""
  max_concurrent_local: 2
  ttft_timeout_ms: 3500
  model_mapping:
    "default": "qwen2.5:7b"
    "gpt-4o-mini": "qwen2.5:7b"
    "qwen2.5:7b": "qwen2.5:7b"

cloud:
  endpoint: "https://api.openai.com/v1"
  api_key: "sk-your-cloud-api-key"
  timeout_ms: 60000
  model_mapping:
    "default": "gpt-4o-mini"
    "qwen2.5:7b": "gpt-4o-mini"

filter:
  enabled: true
  mask_phone: true
  mask_email: true
  mask_ipv4: true
  mask_apikey: true

contract:
  strict_json_enabled: true
  max_repair_attempts: 1
  repair_timeout_ms: 5000

audit:
  sqlite_path: "data/edgecat_audit.db"
  batch_size: 50
  flush_interval_ms: 1000
  queue_size: 10000
