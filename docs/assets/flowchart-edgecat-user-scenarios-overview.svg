<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="20" y="20" width="920" height="480" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="48" y="56" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="0.4">EdgeCat 全景图：一条 AI 请求如何安全、省钱、不卡壳地走完一趟</text>
  <text x="48" y="80" fill="#94a3b8" font-size="13">多设备改地址即连 ➔ 入站隐私打码与配额把关 ➔ 本地免费优先 / 云端自动兜底 ➔ 流式无感还原与静默记账</text>
  <line x1="48" y1="96" x2="912" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ================= ZONE 1: 用户设备 (Left) ================= -->
  <g transform="translate(48, 120)">
    <rect x="0" y="0" width="180" height="340" rx="10" fill="#111827" stroke="#475569" stroke-width="2"/>
    <rect x="12" y="14" width="156" height="28" rx="5" fill="#1e293b"/>
    <text x="90" y="33" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">1. 你的设备与工具</text>

    <!-- Device 1 -->
    <rect x="14" y="58" width="152" height="72" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="82" text-anchor="middle" fill="#bae6fd" font-size="12.5" font-weight="700">个人电脑 / IDE</text>
    <text x="90" y="102" text-anchor="middle" fill="#94a3b8" font-size="11">Chatbox / Cherry Studio</text>
    <text x="90" y="118" text-anchor="middle" fill="#64748b" font-size="10.5">只改 Base URL 即可接入</text>

    <!-- Device 2 -->
    <rect x="14" y="146" width="152" height="72" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="170" text-anchor="middle" fill="#bae6fd" font-size="12.5" font-weight="700">家人平板 / 队友设备</text>
    <text x="90" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">局域网连接 NAS 网关</text>
    <text x="90" y="206" text-anchor="middle" fill="#64748b" font-size="10.5">仅持独立可撤销子令牌</text>

    <!-- Device 3 -->
    <rect x="14" y="234" width="152" height="86" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="258" text-anchor="middle" fill="#bae6fd" font-size="12.5" font-weight="700">自动化工作流</text>
    <text x="90" y="278" text-anchor="middle" fill="#94a3b8" font-size="11">PatchCat / Python SDK</text>
    <text x="90" y="295" text-anchor="middle" fill="#64748b" font-size="10.5">支持深度思考 / 工具调用</text>
    <text x="90" y="310" text-anchor="middle" fill="#64748b" font-size="10.5">与多模态无损透传</text>
  </g>

  <!-- Arrow Zone 1 -> Zone 2 -->
  <path d="M 228 290 L 264 290" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <!-- ================= ZONE 2: EdgeCat 门卫与记忆层 (Center-Left) ================= -->
  <g transform="translate(272, 120)">
    <rect x="0" y="0" width="212" height="340" rx="10" fill="#091914" stroke="#10b981" stroke-width="2"/>
    <rect x="12" y="14" width="188" height="28" rx="5" fill="#065f46"/>
    <text x="106" y="33" text-anchor="middle" fill="#ecfdf5" font-size="13" font-weight="700">2. EdgeCat 门卫与隐私层</text>

    <!-- Auth Guard -->
    <rect x="14" y="56" width="184" height="66" rx="6" fill="#062c22" stroke="#10b981" stroke-width="1"/>
    <text x="106" y="77" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">局域网门卫与子令牌校验</text>
    <text x="106" y="96" text-anchor="middle" fill="#94a3b8" font-size="11">开放局域网强制开鉴权</text>
    <text x="106" y="112" text-anchor="middle" fill="#94a3b8" font-size="11">主 API Key 锁死在服务端</text>

    <!-- PII Masking -->
    <rect x="14" y="136" width="184" height="92" rx="6" fill="#062c22" stroke="#34d399" stroke-width="1.5"/>
    <text x="106" y="157" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">入站隐私自动打码</text>
    <text x="106" y="176" text-anchor="middle" fill="#cbd5e1" font-size="11">手机 / 邮箱 / 内网IP / Key</text>
    <rect x="24" y="185" width="164" height="20" rx="4" fill="#022c22"/>
    <text x="106" y="199" text-anchor="middle" fill="#34d399" font-size="10.5" font-family="monospace">替换为 {{EC_PII_PHONE_1}}</text>
    <text x="106" y="220" text-anchor="middle" fill="#94a3b8" font-size="10.5">真值仅存单次内存，用完即焚</text>

    <!-- Opt-in Memory -->
    <rect x="14" y="242" width="184" height="82" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="106" y="263" text-anchor="middle" fill="#e9d5ff" font-size="12" font-weight="700">可选插件：本地分层记忆</text>
    <text x="106" y="282" text-anchor="middle" fill="#c4b5fd" font-size="10.5">默认关闭 · 纯 Go 中文检索</text>
    <text x="106" y="298" text-anchor="middle" fill="#c4b5fd" font-size="10.5">按设备硬隔离 · 入库前强制脱敏</text>
    <text x="106" y="314" text-anchor="middle" fill="#94a3b8" font-size="10">支持 HMAC 跨请求稳定代号</text>
  </g>

  <!-- Arrows Zone 2 -> Zone 3 (Split Local / Cloud) -->
  <path d="M 484 225 C 504 225, 504 195, 520 195" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 484 315 C 504 315, 504 365, 520 365" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <!-- ================= ZONE 3: 智能分流层 (Center-Right) ================= -->
  <g transform="translate(528, 120)">
    <!-- Local Tier -->
    <rect x="0" y="0" width="192" height="154" rx="10" fill="#091914" stroke="#10b981" stroke-width="2"/>
    <rect x="12" y="14" width="168" height="26" rx="5" fill="#047857"/>
    <text x="96" y="32" text-anchor="middle" fill="#ecfdf5" font-size="12.5" font-weight="700">3A. 本地免费算力优先</text>
    <text x="96" y="62" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">Ollama / vLLM / llama.cpp</text>
    <text x="96" y="84" text-anchor="middle" fill="#cbd5e1" font-size="11">• 零费用、不扣云端配额</text>
    <text x="96" y="103" text-anchor="middle" fill="#cbd5e1" font-size="11">• 并发限流保护显卡不崩</text>
    <text x="96" y="122" text-anchor="middle" fill="#cbd5e1" font-size="11">• 模型别名自动无感映射</text>
    <text x="96" y="141" text-anchor="middle" fill="#6ee7b7" font-size="10.5">含敏感词可锁死仅走本地</text>

    <!-- Fallback Badge -->
    <rect x="20" y="164" width="152" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="96" y="180" text-anchor="middle" fill="#fcd34d" font-size="10.5" font-weight="700">满载 / 首字超时 / 熔断 ▼</text>

    <!-- Cloud Tier -->
    <rect x="0" y="198" width="192" height="142" rx="10" fill="#18120b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="12" y="212" width="168" height="26" rx="5" fill="#b45309"/>
    <text x="96" y="230" text-anchor="middle" fill="#fef3c7" font-size="12.5" font-weight="700">3B. 云端兜底 + 配额闸门</text>
    <text x="96" y="258" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">OpenAI / DeepSeek 等</text>
    <text x="96" y="279" text-anchor="middle" fill="#cbd5e1" font-size="11">• 吐字前静默切流不报错</text>
    <text x="96" y="298" text-anchor="middle" fill="#cbd5e1" font-size="11">• 按设备每日硬限额防刷爆</text>
    <text x="96" y="317" text-anchor="middle" fill="#cbd5e1" font-size="11">• 三态熔断免去重复干等</text>
  </g>

  <!-- Arrows Zone 3 -> Zone 4 -->
  <path d="M 720 195 C 736 195, 736 225, 748 225" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 720 365 C 736 365, 736 305, 748 305" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- ================= ZONE 4: 回程还原与审计 (Right) ================= -->
  <g transform="translate(756, 120)">
    <rect x="0" y="0" width="156" height="340" rx="10" fill="#091326" stroke="#38bdf8" stroke-width="2"/>
    <rect x="10" y="14" width="136" height="28" rx="5" fill="#0369a1"/>
    <text x="78" y="33" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">4. 回程交付与记账</text>

    <!-- Rehydration -->
    <rect x="10" y="56" width="136" height="82" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="78" y="77" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">流式无感还原</text>
    <text x="78" y="96" text-anchor="middle" fill="#cbd5e1" font-size="10.5">滑动窗口跨帧拼回</text>
    <text x="78" y="112" text-anchor="middle" fill="#cbd5e1" font-size="10.5">屏幕直接见真实号码</text>
    <text x="78" y="128" text-anchor="middle" fill="#38bdf8" font-size="10">零额外首字延迟</text>

    <!-- JSON Guard -->
    <rect x="10" y="150" width="136" height="74" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="78" y="171" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">JSON 格式守门员</text>
    <text x="78" y="190" text-anchor="middle" fill="#cbd5e1" font-size="10.5">自动剥离 ```json 外壳</text>
    <text x="78" y="206" text-anchor="middle" fill="#cbd5e1" font-size="10.5">非流式最多自修 1 次</text>

    <!-- Audit -->
    <rect x="10" y="236" width="136" height="88" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="78" y="257" text-anchor="middle" fill="#e9d5ff" font-size="12" font-weight="700">异步 SQLite 记账</text>
    <text x="78" y="276" text-anchor="middle" fill="#c4b5fd" font-size="10.5">只记设备/路由/耗时</text>
    <text x="78" y="292" text-anchor="middle" fill="#c4b5fd" font-size="10.5">绝不落盘聊天正文</text>
    <text x="78" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">单文件纯静态零依赖</text>
  </g>

  <!-- Footer Note -->
  <text x="48" y="486" fill="#64748b" font-size="11.5">EdgeCat (Go 1.26+ / CGO_ENABLED=0) · 本地优先 AI 推理治理网关 · 默认仅监听 127.0.0.1，严禁无鉴权暴露公网</text>
</svg>
