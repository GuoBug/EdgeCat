services:
  edgecat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgecat
    restart: unless-stopped
    ports:
      - "${EDGECAT_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      EDGECAT_CLIENT_TOKEN: "${EDGECAT_CLIENT_TOKEN:?Copy .env.example to .env and set a strong EDGECAT_CLIENT_TOKEN}"
      EDGECAT_LOCAL_ENDPOINT: "${EDGECAT_LOCAL_ENDPOINT:-http://host.docker.internal:11434/v1}"
      EDGECAT_CLOUD_ENDPOINT: "${EDGECAT_CLOUD_ENDPOINT:-https://api.openai.com/v1}"
      EDGECAT_CLOUD_API_KEY: "${EDGECAT_CLOUD_API_KEY:-}"
    volumes:
      - ./configs/edgecat.docker.yaml:/etc/edgecat/edgecat.yaml:ro
      - edgecat_data:/var/lib/edgecat

volumes:
  edgecat_data:
